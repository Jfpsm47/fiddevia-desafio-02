# Configuração de ferramentas do projeto.
# O `pythonpath` faz o comando `pytest`, publicado no README, encontrar o
# pacote `src` a partir da raiz — sem ele a coleta falha com
# "ModuleNotFoundError: No module named 'src'" (BUG-010).

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle · F: pyflakes · I: ordenação de imports · B: bugbear
# D: docstrings · UP: sintaxe moderna · C4: comprehensions
select = ["E", "W", "F", "I", "B", "D", "UP", "C4"]
ignore = [
    "D203",  # conflita com D211
    "D213",  # conflita com D212
    "D401",  # docstrings em português não seguem o modo imperativo do inglês
]

[tool.ruff.lint.per-file-ignores]
# Os testes se explicam pelo nome; classes auxiliares neles são de apoio.
"tests/*" = ["D100", "D101", "D102", "D103", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"
